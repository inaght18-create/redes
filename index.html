<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ignaght · Redes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c1030; --bg2:#1b1450; --moon:#f4edd3; --text:#e9e8f7; --mute:#9a98c4;
  --teal:#4fd1c5; --violet:#8b5cf6; --pink:#ff5fa2; --line:rgba(255,255,255,.14);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100vh; background:radial-gradient(120% 90% at 50% 0%,var(--bg2) 0%,var(--bg) 60%);
  color:var(--text); font-family:"DM Sans",system-ui,sans-serif; overflow-x:hidden;
}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
main{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:7vh 22px 60px;text-align:center}

.moon{
  width:150px;height:150px;margin:0 auto 28px;border-radius:50%;background:transparent;
  box-shadow:0 0 60px 10px rgba(244,237,211,.35),0 0 160px 40px rgba(139,92,246,.35);
  position:relative;animation:rise 1.8s cubic-bezier(.2,.8,.2,1) both, bob 6s ease-in-out 1.8s infinite;
}
.pix{image-rendering:pixelated}
.moon img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
@keyframes rise{from{transform:translateY(90px);opacity:0}to{transform:none;opacity:1}}
@keyframes bob{50%{transform:translateY(-10px)}}

h1{
  font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(2.6rem,12vw,5.6rem);
  letter-spacing:-.03em;line-height:1;margin:0 0 14px;display:flex;justify-content:center;flex-wrap:wrap;
}
h1 span{
  display:inline-block;opacity:0;transform:translateY(40px) rotate(6deg);
  background:linear-gradient(180deg,#fff,var(--moon) 40%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:letter .7s cubic-bezier(.2,.9,.3,1.3) forwards;
}
h1 span:nth-child(1){animation-delay:1.0s}h1 span:nth-child(2){animation-delay:1.07s}
h1 span:nth-child(3){animation-delay:1.14s}h1 span:nth-child(4){animation-delay:1.21s}
h1 span:nth-child(5){animation-delay:1.28s}h1 span:nth-child(6){animation-delay:1.35s}
h1 span:nth-child(7){animation-delay:1.42s}h1 span:nth-child(8){animation-delay:1.49s}
@keyframes letter{to{opacity:1;transform:none}}
.sub{color:var(--mute);font-size:1.05rem;margin:0 0 44px;opacity:0;animation:fade .8s 1.9s forwards}
@keyframes fade{to{opacity:1}}

.links{display:grid;gap:14px;text-align:left;perspective:900px}
.link{
  --c:var(--violet);
  position:relative;display:flex;align-items:center;gap:18px;padding:18px 22px;border-radius:20px;
  color:var(--text);text-decoration:none;border:1px solid var(--line);
  background:rgba(255,255,255,.04);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  overflow:hidden;opacity:0;transform:translateX(-30px);
  animation:in .7s cubic-bezier(.2,.8,.2,1) forwards;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.link:nth-child(1){animation-delay:2.0s}.link:nth-child(2){animation-delay:2.12s}
.link:nth-child(3){animation-delay:2.24s}.link:nth-child(4){animation-delay:2.36s}.link:nth-child(5){animation-delay:2.48s}
@keyframes in{to{opacity:1;transform:none}}
.link::before{
  content:"";position:absolute;inset:0;background:var(--c);transform:translateX(-101%);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:0;opacity:.9;
}
.link>*{position:relative;z-index:1}
.link:hover,.link:focus-visible{transform:translateY(-3px) scale(1.015);border-color:var(--c);box-shadow:0 14px 40px -12px var(--c);outline:none}
.link:hover::before,.link:focus-visible::before{transform:none}
.link:focus-visible{outline:2px solid var(--moon);outline-offset:3px}
.ico{
  width:48px;height:48px;flex:none;border-radius:14px;display:grid;place-items:center;
  background:rgba(255,255,255,.08);transition:transform .35s ease,background .25s;
}
.link:hover .ico{transform:rotate(-8deg) scale(1.12);background:rgba(255,255,255,.2)}
.ico svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico svg .f{fill:currentColor;stroke:none}
.txt{flex:1;min-width:0}
.name{font-family:"Unbounded",sans-serif;font-weight:500;font-size:1.05rem;display:block}
.handle{color:var(--mute);font-size:.95rem;transition:color .25s}
.link:hover .handle{color:#fff}
.go{font-size:1.4rem;transition:transform .3s ease}
.link:hover .go{transform:translateX(6px)}

.dc{--c:#5865f2}.ig{--c:#d6249f}.tt{--c:#14b8c4}.yt{--c:#e0262f}.x{--c:#6d5bd0}

footer{margin-top:44px;color:var(--mute);font-size:.9rem;opacity:0;animation:fade .8s 2.8s forwards}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
@media (max-width:480px){.link{padding:14px 16px;gap:14px}.ico{width:42px;height:42px}}
</style>
</head>

(function(){
  var c=document.getElementById('sky'),x=c.getContext('2d'),W,H,stars=[],shoot=[],mx=0,my=0;
